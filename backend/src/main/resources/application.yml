server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        path: /

spring:
  application:
    name: software-go-selection
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/software_go_selection?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: "yyyy-MM-dd'T'HH:mm:ss"
    serialization:
      write-dates-as-timestamps: false
  # 建表与演示数据只由 backend/scripts 下的脚本显式执行，禁止应用启动时自动灌入。
  sql:
    init:
      mode: never
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:10485760}
      max-request-size: ${UPLOAD_MAX_SIZE:10485760}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads/resumes}
    max-size: ${UPLOAD_MAX_SIZE:10485760}
  stage:
    # 已截止阶段是否允许延长；默认关闭，仅本地演示时可在 application-local.yml 开启。
    allow-extend-ended: ${STAGE_ALLOW_EXTEND_ENDED:false}

logging:
  level:
    com.softwarego.selection: info
