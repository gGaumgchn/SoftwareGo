spring:
  # 允许测试在没有 application-local.yml 时启动；凭据优先取环境变量，
  # 其次取 application-local.yml（该文件已被 Git 忽略）。
  config:
    import: optional:classpath:application-local.yml
  datasource:
    # 当前项目确认 B0 直接在 dev 库验证；需要隔离时设置 TEST_DB_URL
    # 指向 software_go_selection_test（scripts/init-test-db.sh 可初始化）。
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/software_go_selection?useUnicode=true&characterEncoding=utf8&connectionTimeZone=Asia/Shanghai}
    hikari:
      # B0 的最小测试不依赖数据库连接；避免数据库未启动时上下文加载失败。
      initialization-fail-timeout: -1
      maximum-pool-size: 2
      minimum-idle: 0
  sql:
    init:
      # 测试环境禁止自动执行 schema.sql / data.sql，避免破坏已有数据。
      mode: never

app:
  upload:
    # 测试文件写入 target，避免污染 backend/uploads；target 已被 Git 忽略。
    dir: ${TEST_UPLOAD_DIR:target/test-uploads/resumes}
    max-size: 10485760

logging:
  level:
    com.softwarego.selection: warn
