<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主页面 - 实训室选拔系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a18'/%3E%3Cpath d='M16 5 27 25 H5 Z' fill='none' stroke='%23ffffff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='17' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--bg2:#ffffff;--panel:#ffffff;--panel2:#f6f7fb;--line:rgba(255,154,69,.13);--line2:rgba(255,154,69,.3);--cyan:#ff7a18;--blue:#ff9a45;--text:#1f2937;--text2:#64748b;--text3:#94a3b8;--green:#34d399;--amber:#fbbf24;--red:#f87171;--font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--tech:'Rajdhani','Noto Sans SC',sans-serif;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.65;color:var(--text);background:var(--bg);background-image:radial-gradient(1100px 520px at 85% -8%,rgba(255,122,24,.08),transparent 62%),radial-gradient(900px 520px at 6% 108%,rgba(255,154,69,.06),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6dbe6;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(6px)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
.content{flex:1;overflow:auto;padding:24px 30px 44px}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,122,24,.22),rgba(255,154,69,.07));border:1px solid var(--line2);color:var(--cyan)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.4px}
.brand-sub{font-family:var(--tech);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.menu{padding:12px 12px;flex:1;overflow:auto}
.menu-cap{font-size:11px;color:var(--text3);letter-spacing:1px;padding:12px 13px 6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text2);margin-bottom:4px;font-size:14px;transition:.15s;border:1px solid transparent}
.menu-item svg{width:18px;height:18px;flex:0 0 18px}
.menu-item:hover{color:var(--text);background:rgba(255,154,69,.06)}
.menu-item.active{color:var(--cyan);background:rgba(255,122,24,.1);border-color:rgba(255,122,24,.22)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text3);line-height:1.8}
.sidebar-foot a:hover{color:var(--cyan)}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#ffffff;font-weight:700;display:grid;place-items:center;font-size:14px}
.uname{font-size:13px;font-weight:600;line-height:1.2}.urole{font-size:11px;color:var(--text3);line-height:1.2}
.card{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.94));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.stepper{display:flex;margin:6px 0 4px}
.step{flex:1;text-align:center;position:relative;padding-top:24px}
.step .node{position:absolute;top:0;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#eef1f6;border:2px solid #cbd3e0;transition:.2s}
.step.done .node{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 9px rgba(255,122,24,.55)}
.step.current .node{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(255,122,24,.85)}
.step:not(:last-child)::after{content:'';position:absolute;top:6px;left:calc(50% + 11px);width:calc(100% - 22px);height:2px;background:#e4e8f0}
.step.done:not(:last-child)::after{background:linear-gradient(90deg,var(--cyan),rgba(255,122,24,.22))}
.step-name{font-size:12.5px;color:var(--text2);margin-top:8px}
.step.current .step-name{color:var(--cyan);font-weight:600}
.step.done .step-name{color:var(--text)}
.step-time{font-size:11px;color:var(--text3);font-family:var(--tech);margin-top:2px}
.stage-summary{display:flex;align-items:center;gap:34px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.stage-now .k{font-size:12px;color:var(--text3)}.stage-now .v{font-size:16px;font-weight:600;margin-top:2px;color:var(--cyan)}
.stage-now .v small{font-size:12px;color:var(--text2);font-weight:400}
.count-block{display:flex;align-items:baseline;gap:5px}
.count{font-family:var(--tech);font-weight:700;font-size:30px;color:var(--cyan);letter-spacing:1px}
.count small{font-size:12px;color:var(--text3);font-weight:500;margin:0 3px}
.count-label{font-size:12px;color:var(--text3)}
.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-top:20px}
.notice{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,154,69,.07);cursor:pointer;align-items:flex-start}
.notice:last-child{border-bottom:0}
.notice .n-ico{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:rgba(255,154,69,.09);color:var(--blue);display:grid;place-items:center;margin-top:2px}
.notice .n-ico svg{width:15px;height:15px}
.notice .n-t{font-size:13.5px;color:var(--text);font-weight:500}
.notice .n-s{font-size:12.5px;color:var(--text2);margin-top:2px}
.notice .n-time{font-size:11px;color:var(--text3);margin-top:3px;font-family:var(--tech)}
.todo{display:flex;gap:12px;padding:13px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(250,250,252,.92);margin-bottom:10px;align-items:center}
.todo .t-ico{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:grid;place-items:center;background:rgba(255,122,24,.1);color:var(--cyan)}
.todo .t-ico svg{width:17px;height:17px}
.todo .t-body{flex:1;min-width:0}
.todo .t-t{font-size:13.5px;color:var(--text);font-weight:500}
.todo .t-d{font-size:12px;color:var(--text3);margin-top:2px;font-family:var(--tech)}
.todo .t-go{font-size:12px;color:var(--cyan);white-space:nowrap}
.todo:hover{border-color:rgba(255,154,69,.3)}
.empty{padding:44px 20px;text-align:center;color:var(--text3)}
.empty svg{width:42px;height:42px;opacity:.4;margin-bottom:12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);cursor:pointer}
.switch .track{width:32px;height:18px;border-radius:20px;background:#e7eaf1;border:1px solid var(--line);position:relative;transition:.15s}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#94a3b8;transition:.15s}
.switch.on .track{background:rgba(255,122,24,.25);border-color:var(--line2)}
.switch.on .track::after{left:16px;background:var(--cyan)}
.admit-banner{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:14px 18px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.07);border-radius:var(--r);flex-wrap:wrap}
.admit-banner .a-main{display:flex;align-items:center;gap:12px;flex:1;min-width:240px}
.admit-banner .a-ico{width:38px;height:38px;border-radius:10px;background:rgba(52,211,153,.16);color:var(--green);display:grid;place-items:center}
.admit-banner .a-t{font-size:15px;font-weight:600;color:var(--green)}
.admit-banner .a-d{font-size:12.5px;color:var(--text2);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.badge-cyan{color:var(--cyan);border-color:rgba(255,122,24,.35);background:rgba(255,122,24,.08)}
.badge-gray{color:var(--text2);border-color:var(--line);background:rgba(148,163,184,.06)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 19 H3 Z"/><circle cx="12" cy="14.5" r="2.4"/></svg></div>
      <div><div class="brand-name">实训室选拔系统</div><div class="brand-sub">Lab Selection</div></div>
    </div>
    <nav class="menu" id="menu"></nav>
    <div class="sidebar-foot">
      演示原型 · 数据为示例<br><a href="登录.html">退出并重新登录</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">主页面</div>
      <div class="topbar-right">
        <div class="user">
          <div class="avatar" id="avatar">学</div>
          <div><div class="uname" id="uname">—</div><div class="urole" id="urole">—</div></div>
        </div>
      </div>
    </header>

    <div class="content">
      <div class="admit-banner" id="admitBanner" style="display:none">
        <div class="a-main">
          <div class="a-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg></div>
          <div>
            <div class="a-t">已录取</div>
            <div class="a-d">最终去向：智能软件实验室 · 导师 张伟 · 录取状态：已确认（第一轮录取）</div>
          </div>
        </div>
        <span class="badge badge-green">最终录取结果</span>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="dot"></span>选拔进度</div>
          <span class="badge badge-cyan" id="stageBadge">进行中</span>
        </div>
        <div class="stepper" id="stepper"></div>
        <div class="stage-summary">
          <div class="stage-now">
            <div class="k">当前阶段</div>
            <div class="v" id="curStage">—</div>
          </div>
          <div class="stage-now">
            <div class="k">起止时间</div>
            <div class="v" id="curTime" style="color:var(--text)">—</div>
          </div>
          <div class="stage-now">
            <div class="k">截止倒计时</div>
            <div class="count-block">
              <span class="count" id="countdown">—</span>
              <span class="count-label" id="countLabel">距志愿填报截止</span>
            </div>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <div class="card-head">
            <div class="card-title"><span class="dot"></span>公告</div>
            <a href="公告.html" id="viewAll" style="font-size:12.5px;color:var(--cyan)">查看全部</a>
          </div>
          <div id="notices"></div>
        </div>

        <div class="card">
          <div class="card-head">
            <div class="card-title"><span class="dot"></span>个人待办</div>
            <div id="admitSwitchWrap" style="display:none">
              <label class="switch" id="admitSwitch"><span class="track"></span><span>预览已录取状态</span></label>
            </div>
          </div>
          <div id="todos"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var role = (new URLSearchParams(location.search).get('role')) || localStorage.getItem('sel_role') || 'student';
  var admitted = false;

  var STAGES = [
    {name:'集中宣讲', start:'2026-11-18 14:00', end:'2026-11-18 17:00'},
    {name:'实训室开放日', start:'2026-11-19 09:00', end:'2026-11-20 17:00'},
    {name:'第一轮录取', start:'2026-11-23 09:00', end:'2026-11-27 17:00'},
    {name:'第二轮录取', start:'2026-12-01 09:00', end:'2026-12-05 17:00'},
    {name:'第三轮录取', start:'2026-12-08 09:00', end:'2026-12-12 17:00'},
    {name:'调剂', start:'2026-12-15 09:00', end:'2026-12-16 17:00'},
    {name:'正式入组', start:'2026-12-20 09:00', end:'2026-12-20 17:00'}
  ];
  var CUR = 2;

  var USERS = {
    student:{name:'张伟', role:'学生', sno:'2026001001'},
    teacher:{name:'李娜', role:'导师', sno:'2026012001'},
    manager:{name:'刘栋', role:'负责人', sno:'2026023001'}
  };

  var ICONS = {
    home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    building:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/>',
    edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    check:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2 11 14.7 15.5 9.5"/>',
    todo:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 10h6M9 14h6"/>',
    users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
  };

  var MENUS = {
    student:[
      {t:'主页面', href:'主页面.html', icon:'home', active:true},
      {t:'公告', href:'公告.html', icon:'bell'},
      {t:'查看实训室信息', href:'查看实训室信息.html', icon:'building'},
      {t:'志愿填报', href:'志愿填报.html', icon:'edit'},
      {t:'拟录取确认', href:'拟录取确认.html', icon:'check'},
      {t:'个人待办', href:'个人待办.html', icon:'todo'}
    ],
    teacher:[
      {t:'主页面', href:'主页面.html', icon:'home', active:true},
      {t:'公告', href:'公告.html', icon:'bell'},
      {t:'实训室信息', href:'提交实训室信息.html', icon:'building'},
      {t:'申请与录取管理', href:'发放拟录取.html', icon:'users'},
      {t:'个人待办', href:'个人待办.html', icon:'todo'}
    ],
    manager:[
      {t:'主页面', href:'主页面.html', icon:'home', active:true},
      {t:'公告', href:'公告.html', icon:'bell'},
      {t:'阶段管理', href:'阶段管理.html', icon:'calendar'},
      {t:'个人待办', href:'个人待办.html', icon:'todo'}
    ]
  };

  var NOTICES = [
    {t:'关于第一轮志愿填报开放的通知', time:'2026-11-22 09:00', s:'第一轮志愿填报现已开放，请在截止时间前完成填报并上传个人简历。'},
    {t:'实训室开放日安排', time:'2026-11-18 10:00', s:'实训室开放日将于本周进行，请同学们按安排前往各实训室参观交流。'},
    {t:'选拔整体流程说明', time:'2026-11-16 09:00', s:'本年度选拔采用三轮录取 + 统筹调剂方式，各阶段时间以系统配置为准。'}
  ];

  var TODOS = {
    student:[
      {t:'填报志愿', d:'第一轮录取 · 截止 2026-11-27 17:00', href:'志愿填报.html', ico:'edit', type:'cyan'},
      {t:'查看实训室信息', d:'报名准备 · 了解各实训室研究方向', href:'查看实训室信息.html', ico:'building', type:'gray'}
    ],
    teacher:[
      {t:'提交实训室信息', d:'报名准备 · 截止 2026-11-22 17:00', href:'提交实训室信息.html', ico:'building', type:'cyan'},
      {t:'录入第一轮面试分数', d:'第一轮录取 · 截止 2026-11-26 17:00', href:'发放拟录取.html', ico:'users', type:'cyan'}
    ],
    manager:[
      {t:'配置选拔阶段时间', d:'全局 · 尚未配置完整时间', href:'阶段管理.html', ico:'calendar', type:'amber'},
      {t:'确认阶段调整公告', d:'全局 · 保存阶段时可选发布', href:'阶段管理.html', ico:'bell', type:'gray'}
    ]
  };

  function svg(name, extra) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
  }

  function renderMenu(r) {
    var el = document.getElementById('menu');
    el.innerHTML = '<div class="menu-cap">功能菜单 · ' + USERS[r].role + '</div>' +
      MENUS[r].map(function (m) {
        return '<a class="menu-item' + (m.active ? ' active' : '') + '" href="' + m.href + '?role=' + r + '">' + svg(m.icon) + '<span>' + m.t + '</span></a>';
      }).join('');
  }

  function renderUser(r) {
    var u = USERS[r];
    document.getElementById('avatar').textContent = u.name.charAt(0);
    document.getElementById('uname').textContent = u.name + ' · ' + u.sno;
    document.getElementById('urole').textContent = u.role;
  }

  function renderStepper() {
    var el = document.getElementById('stepper');
    el.innerHTML = STAGES.map(function (s, i) {
      var cls = i < CUR ? 'done' : (i === CUR ? 'current' : '');
      return '<div class="step ' + cls + '"><span class="node"></span><div class="step-name">' + s.name + '</div><div class="step-time">' + s.start.slice(0, 10) + '</div></div>';
    }).join('');
    var cur = STAGES[CUR];
    document.getElementById('curStage').innerHTML = cur.name + ' <small>· 志愿填报</small>';
    document.getElementById('curTime').textContent = cur.start + ' ~ ' + cur.end;
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tickCountdown() {
    var target = new Date('2026-11-27T17:00:00+08:00');
    var now = new Date();
    var diff = Math.max(0, target - now);
    var d = Math.floor(diff / 86400000);
    var h = Math.floor(diff % 86400000 / 3600000);
    var m = Math.floor(diff % 3600000 / 60000);
    var s = Math.floor(diff % 60000 / 1000);
    document.getElementById('countdown').innerHTML = d + '天 <small>' + pad(h) + '</small> : <small>' + pad(m) + '</small> : <small>' + pad(s) + '</small>';
  }

  function renderNotices() {
    document.getElementById('notices').innerHTML = NOTICES.map(function (n) {
      return '<div class="notice" onclick="location.href=\'公告.html?role=' + role + '\'"><div class="n-ico">' + svg('bell') + '</div><div style="flex:1;min-width:0"><div class="n-t">' + n.t + '</div><div class="n-s">' + n.s + '</div><div class="n-time">' + n.time + '</div></div></div>';
    }).join('');
  }

  function renderTodos() {
    var box = document.getElementById('todos');
    if (role === 'student' && admitted) {
      box.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 6 1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><div>暂无待办</div></div>';
      return;
    }
    var list = TODOS[role] || [];
    if (!list.length) {
      box.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m4 6 1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><div>暂无待办</div></div>';
      return;
    }
    box.innerHTML = list.map(function (t) {
      return '<a class="todo" href="' + t.href + '?role=' + role + '"><div class="t-ico">' + svg(t.ico) + '</div><div class="t-body"><div class="t-t">' + t.t + '</div><div class="t-d">' + t.d + '</div></div><div class="t-go">前往 ›</div></a>';
    }).join('');
  }

  function render() {
    renderMenu(role);
    renderUser(role);
    renderTodos();
    document.getElementById('viewAll').href = '公告.html?role=' + role;
    document.getElementById('admitSwitchWrap').style.display = role === 'student' ? '' : 'none';
    document.getElementById('admitBanner').style.display = (role === 'student' && admitted) ? 'flex' : 'none';
    document.getElementById('admitSwitch').classList.toggle('on', admitted);
  }

  document.getElementById('admitSwitch').addEventListener('click', function () {
    admitted = !admitted;
    render();
  });

  renderStepper();
  renderNotices();
  render();
  tickCountdown();
  setInterval(tickCountdown, 1000);
})();
</script>
</body>
</html>
