<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>发放拟录取 - 实训室选拔系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a18'/%3E%3Cpath d='M16 5 27 25 H5 Z' fill='none' stroke='%23ffffff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='17' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--bg2:#ffffff;--panel:#ffffff;--panel2:#f6f7fb;--line:rgba(255,154,69,.13);--line2:rgba(255,154,69,.3);--cyan:#ff7a18;--blue:#ff9a45;--text:#1f2937;--text2:#64748b;--text3:#94a3b8;--green:#34d399;--amber:#fbbf24;--red:#f87171;--font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--tech:'Rajdhani','Noto Sans SC',sans-serif;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.65;color:var(--text);background:var(--bg);background-image:radial-gradient(1100px 520px at 85% -8%,rgba(255,122,24,.08),transparent 62%),radial-gradient(900px 520px at 6% 108%,rgba(255,154,69,.06),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6dbe6;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(6px)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
.content{flex:1;overflow:auto;padding:24px 30px 44px}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,122,24,.22),rgba(255,154,69,.07));border:1px solid var(--line2);color:var(--cyan)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.4px}
.brand-sub{font-family:var(--tech);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.menu{padding:12px 12px;flex:1;overflow:auto}
.menu-cap{font-size:11px;color:var(--text3);letter-spacing:1px;padding:12px 13px 6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text2);margin-bottom:4px;font-size:14px;transition:.15s;border:1px solid transparent}
.menu-item svg{width:18px;height:18px;flex:0 0 18px}
.menu-item:hover{color:var(--text);background:rgba(255,154,69,.06)}
.menu-item.active{color:var(--cyan);background:rgba(255,122,24,.1);border-color:rgba(255,122,24,.22)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text3);line-height:1.8}
.sidebar-foot a:hover{color:var(--cyan)}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#ffffff;font-weight:700;display:grid;place-items:center;font-size:14px}
.uname{font-size:13px;font-weight:600;line-height:1.2}.urole{font-size:11px;color:var(--text3);line-height:1.2}
.card{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.94));border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:rgba(250,250,252,.92)}
.stat .s-k{font-size:12px;color:var(--text3)}.stat .s-v{font-size:24px;font-weight:700;font-family:var(--tech);margin-top:3px}
.stat .s-v.cyan{color:var(--cyan)}.stat .s-v.green{color:var(--green)}.stat .s-v.amber{color:var(--amber)}.stat .s-v.gray{color:var(--text2)}
.toolbar{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.field{margin-bottom:0}
.label{display:block;font-size:12.5px;color:var(--text2);margin-bottom:7px}
.input{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:.15s;width:150px}
.input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(255,122,24,.12)}
.input-sm{width:88px;padding:8px 10px;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:10px 20px;border-radius:8px;font-size:13.5px;transition:.15s;font-weight:500}
.btn:hover{border-color:rgba(255,154,69,.5);background:#fff1e3}
.btn-primary{background:linear-gradient(180deg,rgba(255,122,24,.92),rgba(255,154,69,.78));border-color:rgba(255,122,24,.5);color:#ffffff;font-weight:600}
.btn-primary:hover{filter:brightness(1.07)}
.btn-sm{padding:6px 12px;font-size:12.5px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--text3);font-weight:500;font-size:12px;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid rgba(255,154,69,.06);color:var(--text2);vertical-align:middle}
tbody tr:hover{background:rgba(255,154,69,.04)}td strong{color:var(--text);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.badge-cyan{color:var(--cyan);border-color:rgba(255,122,24,.35);background:rgba(255,122,24,.08)}
.badge-amber{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
.badge-red{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.badge-gray{color:var(--text2);border-color:var(--line);background:rgba(148,163,184,.06)}
.help{font-size:12px;color:var(--text3);margin-top:12px}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:98}
.mask.show{display:flex}
.modal{width:480px;max-width:92vw;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(15,23,42,.18)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:4px}
.modal .m-sub{font-size:12.5px;color:var(--text3);margin-bottom:16px}
.modal p{font-size:13.5px;color:var(--text2);line-height:1.8}
.m-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-130%);background:#ffffff;border:1px solid var(--line2);color:var(--text);padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:0 10px 30px rgba(15,23,42,.16);transition:.28s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.ok{border-color:rgba(52,211,153,.45)}.toast.err{border-color:rgba(248,113,113,.45)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 19 H3 Z"/><circle cx="12" cy="14.5" r="2.4"/></svg></div>
      <div><div class="brand-name">实训室选拔系统</div><div class="brand-sub">Lab Selection</div></div>
    </div>
    <nav class="menu">
      <div class="menu-cap">功能菜单 · 导师</div>
      <a class="menu-item" href="主页面.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>主页面</span></a>
      <a class="menu-item" href="公告.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>公告</span></a>
      <a class="menu-item" href="提交实训室信息.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg><span>实训室信息</span></a>
      <a class="menu-item active" href="发放拟录取.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>申请与录取管理</span></a>
      <a class="menu-item" href="个人待办.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 10h6M9 14h6"/></svg><span>个人待办</span></a>
    </nav>
    <div class="sidebar-foot">演示原型 · 数据为示例<br><a href="登录.html">退出并重新登录</a></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">申请与录取管理 · 发放拟录取</div>
      <div class="user"><div class="avatar">李</div><div><div class="uname">李娜 · 2026012001</div><div class="urole">导师</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="dot"></span>本轮申请 · 第一轮录取</div>
          <span class="badge badge-cyan">发放中 · 截止 2026-11-27 18:00</span>
        </div>

        <div class="stat-row">
          <div class="stat"><div class="s-k">本轮招生名额</div><div class="s-v cyan" id="statQuota">4</div></div>
          <div class="stat"><div class="s-k">已确认</div><div class="s-v green" id="statConfirmed">1</div></div>
          <div class="stat"><div class="s-k">待确认</div><div class="s-v amber" id="statPending">1</div></div>
          <div class="stat"><div class="s-k">剩余可发放</div><div class="s-v gray" id="statRemain">2</div></div>
        </div>

        <div class="toolbar">
          <div class="field">
            <label class="label">录取分数线</label>
            <input class="input" id="threshold" type="number" value="85" min="0" max="100">
          </div>
          <button class="btn" id="sortBtn" type="button">按分数排序</button>
          <button class="btn btn-primary" id="releaseBtn" type="button">发放拟录取</button>
        </div>

        <div class="table-wrap">
          <table id="table">
            <thead>
              <tr>
                <th style="width:40px">序</th>
                <th style="width:150px">学工号</th>
                <th style="width:110px">姓名</th>
                <th style="width:130px">面试分数</th>
                <th style="width:120px">状态</th>
                <th style="width:100px">简历</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="help">规则：分数从高到低排序，分数大于等于分数线者按顺序发放，直至名额占满；同分学生由导师手动确定先后顺序。未评分学生不参与发放。</div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">—</h3>
    <div class="m-sub" id="mSub">—</div>
    <p id="mBody">—</p>
    <div class="m-actions"><button class="btn" id="mClose" type="button">关闭</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var QUOTA = 4, CONFIRMED = 1;
  var rows = [
    {sno:'2026001001', name:'张伟', score:'92', status:'confirmed'},
    {sno:'2026001002', name:'王芳', score:'88', status:'pending'},
    {sno:'2026001004', name:'陈晨', score:'87', status:''},
    {sno:'2026001005', name:'周婷', score:'85', status:''},
    {sno:'2026001006', name:'李响', score:'85', status:''},
    {sno:'2026001007', name:'吴迪', score:'', status:''},
    {sno:'2026001008', name:'郑楠', score:'', status:''}
  ];

  function badgeFor(s) {
    if (s === 'confirmed') return '<span class="badge badge-green">已确认</span>';
    if (s === 'pending') return '<span class="badge badge-amber">待确认</span>';
    if (s === 'givenup') return '<span class="badge badge-red">已放弃</span>';
    return '<span class="badge badge-gray">未发放</span>';
  }

  function pendingCount() { return rows.filter(function (r) { return r.status === 'pending'; }).length; }
  function remain() { return Math.max(0, QUOTA - CONFIRMED - pendingCount()); }

  function render() {
    var tb = document.getElementById('tbody');
    tb.innerHTML = rows.map(function (r, i) {
      var scoreCell = (r.status === '') 
        ? '<input class="input input-sm" data-i="' + i + '" type="number" min="0" max="100" value="' + r.score + '" placeholder="未评分">'
        : '<strong>' + (r.score || '—') + '</strong>';
      return '<tr>' +
        '<td style="color:var(--text3)">' + (i + 1) + '</td>' +
        '<td><strong>' + r.sno + '</strong></td>' +
        '<td>' + r.name + '</td>' +
        '<td>' + scoreCell + '</td>' +
        '<td>' + badgeFor(r.status) + '</td>' +
        '<td><button class="btn btn-sm" data-resume="' + i + '" type="button">查看</button></td>' +
        '</tr>';
    }).join('');

    document.getElementById('statPending').textContent = pendingCount();
    document.getElementById('statRemain').textContent = remain();

    tb.querySelectorAll('input[data-i]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        rows[+inp.dataset.i].score = inp.value;
      });
    });
    tb.querySelectorAll('button[data-resume]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = rows[+b.dataset.resume];
        document.getElementById('mTitle').textContent = r.name + ' 的简历';
        document.getElementById('mSub').textContent = '学工号 ' + r.sno + ' · 本轮申请简历（示例）';
        document.getElementById('mBody').textContent = '姓名：' + r.name + '\n意向导师：李娜\n研究方向：云计算与大数据\n教育背景：软件工程专业在读\n相关经历：参与分布式系统课程项目，熟悉 Linux 与 Python；曾获校级程序设计竞赛二等奖。\n\n（演示数据，仅用于展示简历查看入口。）';
        document.getElementById('mask').classList.add('show');
      });
    });
  }

  document.getElementById('sortBtn').addEventListener('click', function () {
    rows.sort(function (a, b) {
      var sa = a.score === '' ? -1 : parseFloat(a.score);
      var sb = b.score === '' ? -1 : parseFloat(b.score);
      return sb - sa;
    });
    render();
    showToast('已按面试分数从高到低排序', true);
  });

  document.getElementById('releaseBtn').addEventListener('click', function () {
    var t = parseFloat(document.getElementById('threshold').value);
    if (isNaN(t) || t < 0 || t > 100) { showToast('请填写有效分数线', false); return; }
    var rem = remain();
    if (rem <= 0) { showToast('名额已满', false); return; }
    var eligible = rows.filter(function (r) { return r.status === '' && r.score !== '' && parseFloat(r.score) >= t; });
    eligible.sort(function (a, b) { return parseFloat(b.score) - parseFloat(a.score); });
    if (!eligible.length) { showToast('暂无可发放的达标学生', false); return; }

    // 同分提示（原型按当前排序处理）
    var scores = eligible.map(function (r) { return r.score; });
    var hasTie = scores.some(function (s, i) { return scores.indexOf(s) !== i; });

    var released = 0;
    for (var i = 0; i < eligible.length && released < rem; i++) {
      eligible[i].status = 'pending';
      released++;
    }
    render();
    var msg = '已发放 ' + released + ' 名拟录取';
    if (hasTie) msg += '（含同分，请确认先后顺序）';
    showToast(msg, true);
  });

  document.getElementById('mClose').addEventListener('click', function () {
    document.getElementById('mask').classList.remove('show');
  });
  document.getElementById('mask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  function showToast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  render();
})();
</script>
<script>(function(){var r='teacher';var as=document.querySelectorAll('a[href]');for(var i=0;i<as.length;i++){var h=as[i].getAttribute('href');if(h&&h.slice(-5)==='.html'&&h.indexOf('?')<0){as[i].setAttribute('href',h+'?role='+r);}}})();</script>
</body>
