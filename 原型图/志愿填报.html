<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>志愿填报 - 实训室选拔系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a18'/%3E%3Cpath d='M16 5 27 25 H5 Z' fill='none' stroke='%23ffffff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='17' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--bg2:#ffffff;--panel:#ffffff;--panel2:#f6f7fb;--line:rgba(255,154,69,.13);--line2:rgba(255,154,69,.3);--cyan:#ff7a18;--blue:#ff9a45;--text:#1f2937;--text2:#64748b;--text3:#94a3b8;--green:#34d399;--amber:#fbbf24;--red:#f87171;--font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--tech:'Rajdhani','Noto Sans SC',sans-serif;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.65;color:var(--text);background:var(--bg);background-image:radial-gradient(1100px 520px at 85% -8%,rgba(255,122,24,.08),transparent 62%),radial-gradient(900px 520px at 6% 108%,rgba(255,154,69,.06),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6dbe6;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(6px)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
.content{flex:1;overflow:auto;padding:24px 30px 44px}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,122,24,.22),rgba(255,154,69,.07));border:1px solid var(--line2);color:var(--cyan)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.4px}
.brand-sub{font-family:var(--tech);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.menu{padding:12px 12px;flex:1;overflow:auto}
.menu-cap{font-size:11px;color:var(--text3);letter-spacing:1px;padding:12px 13px 6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text2);margin-bottom:4px;font-size:14px;transition:.15s;border:1px solid transparent}
.menu-item svg{width:18px;height:18px;flex:0 0 18px}
.menu-item:hover{color:var(--text);background:rgba(255,154,69,.06)}
.menu-item.active{color:var(--cyan);background:rgba(255,122,24,.1);border-color:rgba(255,122,24,.22)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text3);line-height:1.8}
.sidebar-foot a:hover{color:var(--cyan)}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#ffffff;font-weight:700;display:grid;place-items:center;font-size:14px}
.uname{font-size:13px;font-weight:600;line-height:1.2}.urole{font-size:11px;color:var(--text3);line-height:1.2}
.card{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.94));border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.mode-switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.mode-switch button{border:0;background:transparent;color:var(--text2);font-size:12.5px;padding:6px 14px;border-radius:6px;transition:.15s}
.mode-switch button.on{background:rgba(255,122,24,.14);color:var(--cyan)}
.banner-info{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:13px 16px;border:1px solid rgba(255,154,69,.25);background:rgba(255,154,69,.06);border-radius:10px;font-size:13px;color:var(--text2);flex-wrap:wrap}
.banner-info svg{width:18px;height:18px;color:var(--blue);flex:0 0 18px}
.field{margin-bottom:18px}
.label{display:block;font-size:13px;color:var(--text2);margin-bottom:7px}
.label .req{color:var(--cyan)}.label .opt{color:var(--text3);font-weight:400;margin-left:6px}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;outline:none;transition:.15s}
.input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(255,122,24,.12)}
.input.err{border-color:rgba(248,113,113,.5)}
.help{font-size:12px;color:var(--text3);margin-top:6px}
.error{font-size:12px;color:var(--red);margin-top:6px}
.radio-group{display:flex;gap:12px}
.radio{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:14px;color:var(--text2)}
.radio input{display:none}
.radio .rb{width:16px;height:16px;border-radius:50%;border:1px solid #cbd2de;position:relative;flex:0 0 16px;transition:.15s}
.radio input:checked ~ .rb{border-color:var(--cyan)}
.radio input:checked ~ .rb::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--cyan)}
.radio input:checked ~ .rt{color:var(--text)}
.upload{border:1px dashed var(--line2);border-radius:10px;padding:20px;text-align:center;color:var(--text3);cursor:pointer;transition:.15s;background:rgba(250,250,252,.9)}
.upload:hover{border-color:var(--cyan);color:var(--text2)}
.upload.done{border-style:solid;border-color:rgba(52,211,153,.4);color:var(--green);background:rgba(52,211,153,.05)}
.upload svg{width:24px;height:24px;display:block;margin:0 auto 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:10px 22px;border-radius:8px;font-size:14px;transition:.15s;font-weight:500}
.btn:hover:not(:disabled){border-color:rgba(255,154,69,.5);background:#fff1e3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,rgba(255,122,24,.92),rgba(255,154,69,.78));border-color:rgba(255,122,24,.5);color:#ffffff;font-weight:600}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-cyan{color:var(--cyan);border-color:rgba(255,122,24,.35);background:rgba(255,122,24,.08)}
.badge-green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.table-wrap{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--text3);font-weight:500;font-size:12px;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid rgba(255,154,69,.06);color:var(--text2)}
tbody tr:hover{background:rgba(255,154,69,.04)}td strong{color:var(--text);font-weight:500}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-130%);background:#ffffff;border:1px solid var(--line2);color:var(--text);padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:0 10px 30px rgba(15,23,42,.16);transition:.28s;z-index:99;display:flex;gap:8px;align-items:center}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.ok{border-color:rgba(52,211,153,.45)}.toast.err{border-color:rgba(248,113,113,.45)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.form-grid .full{grid-column:1 / -1}
.divider{height:1px;background:var(--line);margin:22px 0}
.actions{display:flex;align-items:center;gap:14px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 19 H3 Z"/><circle cx="12" cy="14.5" r="2.4"/></svg></div>
      <div><div class="brand-name">实训室选拔系统</div><div class="brand-sub">Lab Selection</div></div>
    </div>
    <nav class="menu">
      <div class="menu-cap">功能菜单 · 学生</div>
      <a class="menu-item" href="主页面.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>主页面</span></a>
      <a class="menu-item" href="公告.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>公告</span></a>
      <a class="menu-item" href="查看实训室信息.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg><span>查看实训室信息</span></a>
      <a class="menu-item active" href="志愿填报.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>志愿填报</span></a>
      <a class="menu-item" href="拟录取确认.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2 11 14.7 15.5 9.5"/></svg><span>拟录取确认</span></a>
      <a class="menu-item" href="个人待办.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 10h6M9 14h6"/></svg><span>个人待办</span></a>
    </nav>
    <div class="sidebar-foot">演示原型 · 数据为示例<br><a href="登录.html">退出并重新登录</a></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">志愿填报</div>
      <div class="user"><div class="avatar">张</div><div><div class="uname">张伟 · 2026001001</div><div class="urole">学生</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="dot"></span><span id="formTitle">志愿填报</span></div>
          <div class="mode-switch" id="modeSwitch">
            <button data-mode="first" class="on" type="button">第一轮志愿填报</button>
            <button data-mode="supp" type="button">第二轮补录填报</button>
          </div>
        </div>

        <div id="suppPanel" style="display:none">
          <div class="banner-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
            <span>本轮为补录填报，以下导师仍剩余名额，供查看参考；填报对象须为以下仍有名额的导师。</span>
            <span class="badge badge-cyan">第二轮录取</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th style="width:33%">导师姓名</th><th style="width:34%">所属实训室</th><th style="width:33%">剩余名额</th></tr></thead>
              <tbody>
                <tr><td><strong>王强</strong></td><td>网络与信息安全实验室</td><td><span class="badge badge-cyan">2</span></td></tr>
                <tr><td><strong>赵敏</strong></td><td>计算机视觉实验室</td><td><span class="badge badge-cyan">1</span></td></tr>
                <tr><td><strong>陈刚</strong></td><td>嵌入式与物联网实验室</td><td><span class="badge badge-cyan">2</span></td></tr>
              </tbody>
            </table>
          </div>
          <div class="divider"></div>
        </div>

        <div class="field">
          <label class="label">意向导师<span class="opt">最多填写三名，三个志愿平行、不分优先级</span></label>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
            <input class="input teacher-input" type="text" placeholder="导师姓名（可选）" autocomplete="off">
            <input class="input teacher-input" type="text" placeholder="导师姓名（可选）" autocomplete="off">
            <input class="input teacher-input" type="text" placeholder="导师姓名（可选）" autocomplete="off">
          </div>
          <div class="help">至少填写一名导师；仅输入空格视为未填写；同一导师姓名不能重复填写。</div>
          <div class="error" id="teacherErr"></div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label class="label">是否同意实训室内调剂 <span class="req">*</span></label>
            <div class="radio-group">
              <label class="radio"><input type="radio" name="inner" value="同意"><span class="rb"></span><span class="rt">同意</span></label>
              <label class="radio"><input type="radio" name="inner" value="不同意"><span class="rb"></span><span class="rt">不同意</span></label>
            </div>
          </div>
          <div class="field">
            <label class="label">是否同意学院内调剂 <span class="req">*</span></label>
            <div class="radio-group">
              <label class="radio"><input type="radio" name="outer" value="同意"><span class="rb"></span><span class="rt">同意</span></label>
              <label class="radio"><input type="radio" name="outer" value="不同意"><span class="rb"></span><span class="rt">不同意</span></label>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label">个人简历（PDF）<span class="req">*</span></label>
          <div class="upload" id="upload">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>
            <div id="uploadText">点击上传个人简历，仅支持 PDF 格式，提交前可替换</div>
          </div>
          <input type="file" id="fileInput" accept="application/pdf" style="display:none">
          <div class="error" id="fileErr"></div>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="submitBtn" type="button" disabled>提交志愿</button>
          <span class="help" style="margin:0">完成填写并上传 PDF 简历后可提交</span>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var mode = 'first';
  var uploaded = false, uploadName = '';
  var inputs = document.querySelectorAll('.teacher-input');
  var teacherErr = document.getElementById('teacherErr');
  var fileErr = document.getElementById('fileErr');
  var submitBtn = document.getElementById('submitBtn');
  var upload = document.getElementById('upload');
  var uploadText = document.getElementById('uploadText');
  var fileInput = document.getElementById('fileInput');

  document.getElementById('modeSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSwitch button').forEach(function (x) { x.classList.toggle('on', x === b); });
    var supp = mode === 'supp';
    document.getElementById('suppPanel').style.display = supp ? '' : 'none';
    document.getElementById('formTitle').textContent = supp ? '第二轮录取 · 志愿填报（补录）' : '志愿填报';
    document.getElementById('pageTitle').textContent = supp ? '志愿填报 · 补录' : '志愿填报';
    updateSubmit();
  });

  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      inp.classList.remove('err');
      teacherErr.textContent = '';
      updateSubmit();
    });
    inp.addEventListener('blur', checkDup);
  });

  function checkDup() {
    var vals = Array.prototype.map.call(inputs, function (x) { return x.value.trim(); }).filter(Boolean);
    var dup = vals.some(function (v, i) { return vals.indexOf(v) !== i; });
    if (dup) {
      teacherErr.textContent = '导师姓名不能重复';
      inputs.forEach(function (x) { if (x.value.trim() && vals.indexOf(x.value.trim()) !== vals.lastIndexOf(x.value.trim())) x.classList.add('err'); });
    } else {
      teacherErr.textContent = '';
    }
    updateSubmit();
  }

  upload.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files[0];
    if (!f) return;
    if (f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) {
      fileErr.textContent = '请上传 PDF 格式的简历';
      uploaded = false;
      upload.classList.remove('done');
      uploadText.textContent = '点击上传个人简历，仅支持 PDF 格式，提交前可替换';
      updateSubmit();
      return;
    }
    fileErr.textContent = '';
    uploaded = true;
    uploadName = f.name;
    upload.classList.add('done');
    uploadText.textContent = '已上传：' + f.name;
    updateSubmit();
  });

  function hasTeacher() {
    return Array.prototype.some.call(inputs, function (x) { return x.value.trim() !== ''; });
  }
  function hasDup() {
    var vals = Array.prototype.map.call(inputs, function (x) { return x.value.trim(); }).filter(Boolean);
    return vals.some(function (v, i) { return vals.indexOf(v) !== i; });
  }
  function radioVal(name) {
    var r = document.querySelector('input[name="' + name + '"]:checked');
    return r ? r.value : null;
  }

  function updateSubmit() {
    submitBtn.disabled = !(hasTeacher() && !hasDup() && radioVal('inner') && radioVal('outer') && uploaded);
  }

  document.querySelectorAll('input[type="radio"]').forEach(function (r) { r.addEventListener('change', updateSubmit); });

  function showToast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  submitBtn.addEventListener('click', function () {
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    submitBtn.textContent = '提交中…';
    setTimeout(function () {
      submitBtn.textContent = '提交志愿';
      submitBtn.disabled = false;
      showToast(mode === 'supp' ? '提交成功（第二轮补录申请）' : '提交成功', true);
    }, 700);
  });
})();
</script>
