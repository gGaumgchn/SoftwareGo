<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拟录取确认 - 实训室选拔系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a18'/%3E%3Cpath d='M16 5 27 25 H5 Z' fill='none' stroke='%23ffffff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='17' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--bg2:#ffffff;--panel:#ffffff;--panel2:#f6f7fb;--line:rgba(255,154,69,.13);--line2:rgba(255,154,69,.3);--cyan:#ff7a18;--blue:#ff9a45;--text:#1f2937;--text2:#64748b;--text3:#94a3b8;--green:#34d399;--amber:#fbbf24;--red:#f87171;--font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--tech:'Rajdhani','Noto Sans SC',sans-serif;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.65;color:var(--text);background:var(--bg);background-image:radial-gradient(1100px 520px at 85% -8%,rgba(255,122,24,.08),transparent 62%),radial-gradient(900px 520px at 6% 108%,rgba(255,154,69,.06),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#d6dbe6;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;color:var(--text)}
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:rgba(255,255,255,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;backdrop-filter:blur(6px)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px)}
.content{flex:1;overflow:auto;padding:24px 30px 44px}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:0 0 38px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,122,24,.22),rgba(255,154,69,.07));border:1px solid var(--line2);color:var(--cyan)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.4px}
.brand-sub{font-family:var(--tech);font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.menu{padding:12px 12px;flex:1;overflow:auto}
.menu-cap{font-size:11px;color:var(--text3);letter-spacing:1px;padding:12px 13px 6px}
.menu-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--text2);margin-bottom:4px;font-size:14px;transition:.15s;border:1px solid transparent}
.menu-item svg{width:18px;height:18px;flex:0 0 18px}
.menu-item:hover{color:var(--text);background:rgba(255,154,69,.06)}
.menu-item.active{color:var(--cyan);background:rgba(255,122,24,.1);border-color:rgba(255,122,24,.22)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--text3);line-height:1.8}
.sidebar-foot a:hover{color:var(--cyan)}
.topbar-title{font-size:16px;font-weight:600;letter-spacing:.5px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#ffffff;font-weight:700;display:grid;place-items:center;font-size:14px}
.uname{font-size:13px;font-weight:600;line-height:1.2}.urole{font-size:11px;color:var(--text3);line-height:1.2}
.card{background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.94));border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.mode-switch{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.mode-switch button{border:0;background:transparent;color:var(--text2);font-size:12.5px;padding:6px 13px;border-radius:6px;transition:.15s}
.mode-switch button.on{background:rgba(255,122,24,.14);color:var(--cyan)}
.offer{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:rgba(250,250,252,.92);display:flex;align-items:center;gap:16px}
.offer .o-ico{width:44px;height:44px;flex:0 0 44px;border-radius:11px;display:grid;place-items:center;background:rgba(255,154,69,.1);color:var(--blue)}
.offer .o-ico svg{width:22px;height:22px}
.offer .o-body{flex:1;min-width:0}
.offer .o-lab{font-size:15px;font-weight:600;color:var(--text)}
.offer .o-meta{font-size:12.5px;color:var(--text2);margin-top:5px;display:flex;flex-wrap:wrap;gap:5px 18px}
.offer .o-meta b{color:var(--text3);font-weight:400}
.offer .o-meta .deadline{color:var(--amber);font-family:var(--tech)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge-cyan{color:var(--cyan);border-color:rgba(255,122,24,.35);background:rgba(255,122,24,.08)}
.badge-green{color:var(--green);border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
.badge-red{color:var(--red);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.08)}
.badge-gray{color:var(--text2);border-color:var(--line);background:rgba(148,163,184,.06)}
.badge-blue{color:var(--blue);border-color:rgba(255,154,69,.35);background:rgba(255,154,69,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:9px 20px;border-radius:8px;font-size:13.5px;transition:.15s;font-weight:500}
.btn:hover:not(:disabled){border-color:rgba(255,154,69,.5);background:#fff1e3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,rgba(255,122,24,.92),rgba(255,154,69,.78));border-color:rgba(255,122,24,.5);color:#ffffff;font-weight:600}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-ghost{background:transparent}
.banner-info{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:13px 16px;border:1px solid rgba(255,154,69,.25);background:rgba(255,154,69,.06);border-radius:10px;font-size:13px;color:var(--text2)}
.banner-info svg{width:18px;height:18px;color:var(--blue);flex:0 0 18px}
.empty{padding:56px 20px;text-align:center;color:var(--text3)}
.empty svg{width:44px;height:44px;opacity:.4;margin-bottom:12px}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:98}
.mask.show{display:flex}
.modal{width:460px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:26px;box-shadow:0 20px 60px rgba(15,23,42,.18)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:12px}
.modal p{font-size:13.5px;color:var(--text2);margin-bottom:22px;line-height:1.7}
.modal .m-actions{display:flex;justify-content:flex-end;gap:12px}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-130%);background:#ffffff;border:1px solid var(--line2);color:var(--text);padding:11px 20px;border-radius:9px;font-size:13.5px;box-shadow:0 10px 30px rgba(15,23,42,.16);transition:.28s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}.toast.ok{border-color:rgba(52,211,153,.45)}.toast.err{border-color:rgba(248,113,113,.45)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 19 H3 Z"/><circle cx="12" cy="14.5" r="2.4"/></svg></div>
      <div><div class="brand-name">实训室选拔系统</div><div class="brand-sub">Lab Selection</div></div>
    </div>
    <nav class="menu">
      <div class="menu-cap">功能菜单 · 学生</div>
      <a class="menu-item" href="主页面.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span>主页面</span></a>
      <a class="menu-item" href="公告.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span>公告</span></a>
      <a class="menu-item" href="查看实训室信息.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg><span>查看实训室信息</span></a>
      <a class="menu-item" href="志愿填报.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>志愿填报</span></a>
      <a class="menu-item active" href="拟录取确认.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2 11 14.7 15.5 9.5"/></svg><span>拟录取确认</span></a>
      <a class="menu-item" href="个人待办.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0"/><path d="M9 10h6M9 14h6"/></svg><span>个人待办</span></a>
    </nav>
    <div class="sidebar-foot">演示原型 · 数据为示例<br><a href="登录.html">退出并重新登录</a></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">拟录取确认</div>
      <div class="user"><div class="avatar">张</div><div><div class="uname">张伟 · 2026001001</div><div class="urole">学生</div></div></div>
    </header>

    <div class="content">
      <div class="card">
        <div class="card-head">
          <div class="card-title"><span class="dot"></span>拟录取确认</div>
          <div class="mode-switch" id="modeSwitch">
            <button data-mode="offer" class="on" type="button">志愿拟录取</button>
            <button data-mode="adjust" type="button">调剂结果（只读）</button>
            <button data-mode="none" type="button">暂无拟录取</button>
          </div>
        </div>

        <div id="list"></div>
      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3>确认拟录取</h3>
    <p id="modalText">确认后不可更改，其他拟录取将自动放弃。</p>
    <div class="m-actions">
      <button class="btn btn-ghost" id="cancelBtn" type="button">取消</button>
      <button class="btn btn-primary" id="confirmBtn" type="button">确认录取</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  var mode = 'offer';
  var state = { confirmed: false, target: null };

  function badge(type, text) {
    return '<span class="badge badge-' + type + '">' + text + '</span>';
  }

  function offerItem(lab, mentor, round, deadline, status, idx) {
    var statusHtml = '';
    if (status === 'pending') statusHtml = badge('cyan', '待确认');
    else if (status === 'confirmed') statusHtml = badge('green', '已确认');
    else if (status === 'givenup') statusHtml = badge('red', '已放弃');
    var btn = (status === 'pending') ? '<button class="btn btn-primary" data-idx="' + idx + '">确认</button>' : '<button class="btn" disabled style="opacity:.5">已结束</button>';
    return '<div class="offer" data-idx="' + idx + '">' +
      '<div class="o-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/></svg></div>' +
      '<div class="o-body"><div class="o-lab">' + lab + '</div>' +
      '<div class="o-meta"><span>导师 <b>' + mentor + '</b></span><span>轮次 <b>' + round + '</b></span><span>确认截止 <b class="deadline">' + deadline + '</b></span></div></div>' +
      '<div style="display:flex;align-items:center;gap:12px">' + statusHtml + btn + '</div></div>';
  }

  function render() {
    var box = document.getElementById('list');
    document.getElementById('modalText').textContent = '确认后不可更改，其他拟录取将自动放弃。';

    if (mode === 'none') {
      box.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg><div>暂无拟录取</div></div>';
      return;
    }

    if (mode === 'adjust') {
      box.innerHTML = '<div class="banner-info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg><span>三轮结束后的统筹调剂直接形成录取结果，无需确认，仅展示最终去向。</span></div>' +
        offerItem('嵌入式与物联网实验室', '陈刚', '统筹调剂', '—', 'confirmed', 0).replace('<button class="btn" disabled style="opacity:.5">已结束</button>', badge('blue', '已录取 · 无需确认'));
      return;
    }

    var st1 = state.confirmed ? (state.target === 0 ? 'confirmed' : 'givenup') : 'pending';
    var st2 = state.confirmed ? (state.target === 1 ? 'confirmed' : 'givenup') : 'pending';
    box.innerHTML = offerItem('智能软件实验室', '张伟', '第一轮录取', '2026-11-27 18:00', st1, 0) +
      offerItem('云计算与大数据实验室', '李娜', '第一轮录取', '2026-11-27 18:00', st2, 1);

    if (state.confirmed) {
      box.insertAdjacentHTML('beforeend', '<div class="banner-info" style="margin:16px 0 0;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.06)"><svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12.5 5 5L20 6.5"/></svg><span style="color:var(--green)">已确认录取去向，其余拟录取已自动放弃，不可再更改。</span></div>');
    }

    box.querySelectorAll('button[data-idx]').forEach(function (b) {
      b.addEventListener('click', function () {
        var idx = +b.dataset.idx;
        if (state.confirmed) { showToast('已确认录取，不可更改', false); return; }
        state.target = idx;
        document.getElementById('mask').classList.add('show');
      });
    });
  }

  document.getElementById('modeSwitch').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSwitch button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });

  document.getElementById('cancelBtn').addEventListener('click', function () {
    document.getElementById('mask').classList.remove('show');
  });

  document.getElementById('confirmBtn').addEventListener('click', function () {
    document.getElementById('mask').classList.remove('show');
    state.confirmed = true;
    render();
    showToast('确认成功', true);
  });

  function showToast(msg, ok) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (ok ? 'ok' : 'err');
    setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  render();
})();
</script>
<script>(function(){var r='student';var as=document.querySelectorAll('a[href]');for(var i=0;i<as.length;i++){var h=as[i].getAttribute('href');if(h&&h.slice(-5)==='.html'&&h.indexOf('?')<0){as[i].setAttribute('href',h+'?role='+r);}}})();</script>
</body>
