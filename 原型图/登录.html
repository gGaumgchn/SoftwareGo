<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 实训室选拔系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a18'/%3E%3Cpath d='M16 5 27 25 H5 Z' fill='none' stroke='%23ffffff' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='17' r='3.2' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#f5f6fa;--bg2:#ffffff;--panel:#ffffff;--panel2:#f6f7fb;--line:rgba(255,154,69,.13);--line2:rgba(255,154,69,.3);--cyan:#ff7a18;--blue:#ff9a45;--text:#1f2937;--text2:#64748b;--text3:#94a3b8;--green:#34d399;--amber:#fbbf24;--red:#f87171;--font:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;--tech:'Rajdhani','Noto Sans SC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.65;color:var(--text);background:var(--bg);overflow:hidden;background-image:radial-gradient(1100px 520px at 82% -8%,rgba(255,122,24,.1),transparent 62%),radial-gradient(900px 520px at 8% 108%,rgba(255,154,69,.08),transparent 60%),linear-gradient(180deg,var(--bg2),var(--bg))}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}input{font-family:inherit;color:var(--text)}
.grid-bg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,154,69,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,154,69,.05) 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 74%);mask-image:radial-gradient(circle at 50% 42%,#000 0%,transparent 74%)}
.wrap{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,122,24,.24),rgba(255,154,69,.07));border:1px solid var(--line2);color:var(--cyan);box-shadow:0 0 34px rgba(255,122,24,.22)}
.brand-t h1{font-size:26px;font-weight:700;letter-spacing:1px}
.brand-t p{font-family:var(--tech);font-size:12px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-top:2px}
.card{width:472px;max-width:94vw;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.96));border:1px solid var(--line);border-radius:16px;padding:30px 32px;box-shadow:0 30px 80px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.03)}
.sec-title{font-size:13px;color:var(--text2);margin-bottom:10px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.role{position:relative;border:1px solid var(--line);background:rgba(255,255,255,.88);border-radius:10px;padding:13px 8px;text-align:center;color:var(--text2);transition:.15s}
.role svg{width:22px;height:22px;display:block;margin:0 auto 6px;color:var(--text2)}
.role span{font-size:13.5px}
.role:hover{border-color:rgba(255,154,69,.4);color:var(--text)}
.role.on{border-color:var(--line2);background:rgba(255,122,24,.1);color:var(--cyan);box-shadow:0 0 0 3px rgba(255,122,24,.1)}
.role.on svg{color:var(--cyan)}
.field{margin-bottom:18px}
.label{display:block;font-size:13px;color:var(--text2);margin-bottom:7px}
.label .req{color:var(--cyan)}
.input{width:100%;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:15px;letter-spacing:1.5px;outline:none;transition:.15s;font-family:var(--tech);font-weight:600}
.input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(255,122,24,.12)}
.input:disabled{opacity:.55;cursor:not-allowed}
.input.err{border-color:rgba(248,113,113,.5)}
.error{font-size:12px;color:var(--red);margin-top:6px;min-height:18px}
.face-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.face-state{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text3)}
.face-state.ok{color:var(--green)}
.btn{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:12px 18px;border-radius:9px;font-size:15px;transition:.15s;font-weight:600}
.btn:hover:not(:disabled){border-color:rgba(255,154,69,.5);background:#fff1e3}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,rgba(255,122,24,.92),rgba(255,154,69,.78));border-color:rgba(255,122,24,.5);color:#ffffff}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-face{background:transparent;border-color:var(--line);font-weight:500;width:auto;padding:11px 22px}
.btn-face:hover:not(:disabled){border-color:var(--line2);color:var(--cyan)}
.foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--text3);line-height:1.8}
.copyright{font-size:12px;color:var(--text3)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 21 19 H3 Z"/><circle cx="12" cy="14.5" r="2.4"/></svg>
    </div>
    <div class="brand-t">
      <h1>实训室选拔系统</h1>
      <p>Software Lab Selection System</p>
    </div>
  </div>

  <div class="card">
    <div class="sec-title">选择登录身份</div>
    <div class="roles" id="roles">
      <button class="role" data-role="student" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 21h20Z" opacity="0"/><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
        <span>学生</span>
      </button>
      <button class="role" data-role="teacher" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 8 6l8-2 4 14"/><path d="m8 6 12 6-8 4-4-6"/></svg>
        <span>导师</span>
      </button>
      <button class="role" data-role="manager" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4-4 4 4M3 16l4 4 4-4"/><path d="M7 4v8M7 12v8"/><circle cx="16" cy="12" r="3"/><path d="M14.5 12H12m8 0h-2.5"/></svg>
        <span>负责人</span>
      </button>
    </div>

    <div class="field">
      <label class="label">学工号 <span class="req">*</span></label>
      <input class="input" id="sno" type="text" maxlength="10" placeholder="请输入 10 位学工号" autocomplete="off">
      <div class="error" id="snoErr"></div>
    </div>

    <div class="face-row">
      <button class="btn btn-face" id="faceBtn" type="button">人脸比对</button>
      <div class="face-state" id="faceState">模拟比对，不采集人脸数据</div>
    </div>

    <button class="btn btn-primary" id="loginBtn" type="button" disabled>进入系统</button>

    <div class="foot">
      无需注册、无需密码。身份以所选为准，学工号格式为 10 位数字（四位年份 + 三位代码 + 三位序号）。<br>人脸比对仅为模拟操作，不调用摄像头，不采集、上传或存储人脸数据。
    </div>
  </div>

  <div class="copyright">软件学院 · 实训室选拔系统 ｜ 原型设计稿</div>
</div>

<script>
(function () {
  var role = null, verified = false;
  var roleBtns = document.querySelectorAll('.role');
  var sno = document.getElementById('sno');
  var snoErr = document.getElementById('snoErr');
  var faceBtn = document.getElementById('faceBtn');
  var faceState = document.getElementById('faceState');
  var loginBtn = document.getElementById('loginBtn');

  roleBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      roleBtns.forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      role = b.dataset.role;
      updateLogin();
    });
  });

  sno.addEventListener('input', function () {
    sno.classList.remove('err');
    snoErr.textContent = '';
    updateLogin();
  });

  faceBtn.addEventListener('click', function () {
    if (verified) return;
    var v = sno.value.trim();
    if (!/^\d{10}$/.test(v)) {
      sno.classList.add('err');
      snoErr.textContent = '学工号异常';
      return;
    }
    sno.classList.remove('err');
    snoErr.textContent = '';
    verified = true;
    sno.disabled = true;
    faceBtn.disabled = true;
    faceState.textContent = '比对成功';
    faceState.classList.add('ok');
    updateLogin();
  });

  function updateLogin() {
    loginBtn.disabled = !(role && verified);
  }

  loginBtn.addEventListener('click', function () {
    if (loginBtn.disabled) return;
    localStorage.setItem('sel_role', role);
    location.href = '主页面.html?role=' + role;
  });
})();
</script>
</body>
</html>
